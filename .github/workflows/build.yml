name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Initialize and Configure Buildozer
        run: |
          buildozer init
          sed -i 's/#requirements = python3,pygame/requirements = python3,pygame,pillow/' buildozer.spec
          sed -i 's/#p4a.branch = stable/p4a.branch = master/' buildozer.spec
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: bin/*.apk
